name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
