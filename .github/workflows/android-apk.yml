name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'capacitor.config.ts'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
